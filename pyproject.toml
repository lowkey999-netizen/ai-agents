[project]
name = "ai-agents"
version = "0.1.0"
description = "My Journey to learn Agents."
readme = "README.md"
authors = [
    { name = "Bhargava Shanmukha", email = "shanmukhabhargava0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "gradio>=6.30.0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "smolagents[litellm]>=1.26.0",
]

[project.scripts]
ai-agents = "ai_agents:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
